name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 类型检查 / 构建 / 接口测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本取自 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（后端 tsc + 前端 vue-tsc）
        run: pnpm typecheck

      - name: 构建三个包
        run: pnpm build

      - name: 初始化数据库（建表 + 演示数据）
        run: pnpm db:reset

      - name: 启动后端服务
        run: |
          cd server
          node dist/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health

      - name: 接口冒烟测试（69 项断言）
        run: node server/scripts/api-smoke.mjs

  package:
    name: 构建部署产物
    runs-on: windows-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本取自 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包免安装版（含内置 Node 运行时）
        run: pnpm package

      - name: 制作 Windows 安装程序
        run: pnpm installer

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: school-erp-release
          path: |
            release/*.zip
            release/*.exe
          retention-days: 14

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.exe
          generate_release_notes: true
